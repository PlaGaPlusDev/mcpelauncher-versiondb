name: Add warning to versions

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions to warn (space or comma separated, newest first)"
        required: true
        type: string
        default: "1.26.50.22 1.26.50.20"
      reason:
        description: "Reason / note for the warning"
        required: true
        type: string
        default: "Bug during animations on x86_64 builds for Minecraft Bedrock"

jobs:
  add-warning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply warning
        env:
          WARN_VERSIONS: ${{ inputs.versions }}
          WARN_REASON: ${{ inputs.reason }}
        run: python warn_ci.py

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet version-warnings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version-warnings.json
            git commit -m "Add warning for: ${{ inputs.versions }}"
            git push
          else
            echo "No changes to version-warnings.json"
          fi
